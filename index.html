<style>
/* Layout: phone-first single column, max 520px; airy white header with the balance, white cards on a soft lavender-grey ground; violet accent, coral and teal for money. Light only, by request */
:root{
  --bg:#f4f5fa; --surface:#ffffff; --surface2:#f1f2f8; --fg:#1d1f2c; --muted:#747a8f; --line:#e7e8f0; --ring:#eef0f6;
  --head:#ffffff; --head-ink:#1d1f2c; --head-muted:#8b90a5;
  --accent:#6c5ce7; --accent-ink:#ffffff; --green:#6c5ce7; --tag:#efecff; --tag-ink:#5443d6;
  --exp:#e5484d; --inc:#12a594; --warn:#f59e0b; --c-inc:#12b5a5; --c-exp:#ff7a59; --c-pr:#6c5ce7;
  --scrim:rgba(20,22,40,.35); --shadow:0 1px 2px rgba(30,32,60,.04),0 8px 24px rgba(30,32,60,.06);
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mi{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 1,"wght" 450,"GRAD" 0,"opsz" 24;width:1em;overflow:hidden;flex:none;user-select:none}
.mi.xs{font-size:18px}
#view{max-width:520px;margin:0 auto;min-height:100vh}

/* header */
.bar{background:var(--head);color:var(--head-ink);border-radius:0 0 26px 26px;box-shadow:0 1px 0 var(--line),0 10px 30px rgba(30,32,60,.05)}
.bar .in{padding-block:8px 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.toprow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;min-height:52px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--head-ink)}
.ib:active{background:var(--surface2)}
.ib.ph{visibility:hidden}
.ttl{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;padding-block:4px 10px}
.ttl small{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--head-muted)}
.ttl b{font-family:var(--f-num);font-weight:800;font-size:22px;letter-spacing:-.01em}
.ttl .t1{font-family:var(--f-body);font-size:17px;font-weight:700;padding-top:6px}
.bal{font-family:var(--f-num);font-weight:800;letter-spacing:-.02em;font-size:clamp(22px,6.6vw,28px);line-height:1.2;word-break:break-word}
.accsel{display:inline-flex;align-items:center;gap:4px;color:var(--head-muted);font-weight:700;font-size:14px;padding:4px 8px;border-radius:10px}
.ktabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:2px 12px 12px;padding:4px;background:var(--surface2);border-radius:14px}
.ktabs.three{grid-template-columns:1fr 1fr 1fr}
.ktabs button{padding:9px 4px;font-weight:700;font-size:14px;color:var(--head-muted);border-radius:10px}
.ktabs button[aria-pressed="true"]{color:var(--head-ink);background:var(--surface);box-shadow:0 1px 3px rgba(30,32,60,.1)}


.page{display:flex;flex-direction:column;gap:12px;padding-block:14px 110px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.page.form{gap:16px;padding-bottom:40px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:20px 16px;margin:0}
.note{color:var(--muted);font-size:13px;margin:0}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font-size:14px}
.banner b{display:block}
.banner button{margin-left:auto;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}

/* period */
.pbar{padding:8px 8px 4px}
.ptabs{display:flex;justify-content:space-between;gap:2px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1 0 auto;padding:8px 8px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.ptabs button[aria-pressed="true"]{color:var(--green);border-color:var(--green)}
.pnav{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding-top:4px}
.ib2{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ib2[aria-pressed="true"]{color:var(--green)}
.ghosted{visibility:hidden}
.plabel{text-align:center;font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--muted)}
.pcustom{display:flex;align-items:center;gap:8px;padding:8px 4px}
.pcustom input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px}

/* donut */
.donut{position:relative;display:grid;place-items:center;padding:6px 16px 12px}
.donut svg{width:min(230px,62vw);height:auto}
.dtot{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:clamp(17px,5vw,21px);pointer-events:none;padding:0 30%;text-align:center}
.fab{position:absolute;right:16px;bottom:14px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(108,92,231,.35)}
.fab .mi{font-size:30px;font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}

/* category rows */
.crows{padding:2px 6px 8px}
.crow+.crow{border-top:1px solid var(--line)}
.cmain{width:100%;display:grid;grid-template-columns:34px 1fr auto auto 22px;align-items:center;gap:10px;padding:10px 6px;text-align:left}
.cn{min-width:0;display:flex;flex-direction:column}
.cn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:3px}
.pb{flex:1;max-width:90px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pb i{display:block;height:100%}
.pct{color:var(--muted);font-size:13px}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.chev{color:var(--muted);transition:transform .2s}
.crow.open .chev{transform:rotate(180deg)}
.tagrows{display:flex;flex-direction:column;padding:0 6px 8px 50px}
.trow{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:8px 6px;text-align:left;font-size:14px;color:var(--muted);border-radius:10px}
.trow span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.trow.all span:nth-child(2){color:var(--green);font-weight:700}
.trow:active,.op:active,.cmain:active{background:var(--surface2)}

.ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.ci .mi{font-size:24px}
.ci.sm{width:36px;height:36px;border-radius:12px}
.ci.sm .mi{font-size:19px}
.ci.more{background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.ci.acc{background:var(--tag);color:var(--tag-ink)}

/* operations */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.accchip,.fchip{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.fchip{background:var(--tag);color:var(--tag-ink);box-shadow:none}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;width:100%;box-sizing:border-box;min-width:0}
.dhead{margin:6px 4px -4px;font-size:13px;font-weight:700;color:var(--muted)}
.list{overflow:hidden}
.op{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:12px 14px;text-align:left}
.op+.op{border-top:1px solid var(--line)}
.opm{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.opm b{font-weight:700}
.sub{font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note.sub{white-space:normal}
.tagp{font-size:12px;font-weight:700;background:var(--tag);color:var(--tag-ink);border-radius:6px;padding:2px 8px;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opv{font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:4px;padding-top:6px}
.opv.income{color:var(--inc)}
.opt[aria-pressed="true"] .opv{color:var(--green)}

/* form */
.amt-row{display:flex;align-items:center;justify-content:center;gap:10px}
.amt-row input{width:min(220px,55vw);text-align:center;border:0;border-bottom:2px solid var(--line);background:transparent;font-family:var(--f-num);font-weight:600;font-size:30px;padding:6px 0;outline:none}
.amt-row input:focus{border-color:var(--green)}
.code{color:var(--green);font-weight:800;font-size:20px}
.calc{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.calc button{background:var(--surface);border-radius:10px;padding:10px 0;font-weight:800;font-size:18px;box-shadow:inset 0 0 0 1px var(--line)}
.err{color:var(--exp);font-size:13px;font-weight:700;margin:-8px 0 0;text-align:center}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.lblrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:-8px}
.linkv{align-self:flex-start;color:var(--green);font-weight:700;font-size:16px;padding:2px 0}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px}
.cgrid.big{gap:10px 4px}
.cpick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:600;text-align:center;min-width:0}
.cpick>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpick[aria-pressed="true"]{background:var(--surface)}
.cpick[aria-pressed="true"] .ci{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.dates{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.dchip{flex:none;display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:10px;min-width:64px}
.dchip b{font-weight:800}
.dchip span{font-size:12px;color:var(--muted)}
.dchip[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink)}
.dchip[aria-pressed="true"] span{color:var(--tag-ink);opacity:.85}
.calbtn{position:relative;margin-left:auto;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:10px}
.calbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);max-width:100%}
.tchip[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);box-shadow:none}
.tchip.add{color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:transparent}
.uline{border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:8px 0;outline:none;width:100%;min-width:0}
.uline:focus{border-color:var(--green)}
.uline.bad{border-color:var(--exp)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:6px}
.cta{min-width:min(240px,70%);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;padding:15px 24px;border-radius:999px}
.dbtn{white-space:nowrap;display:grid;place-items:center;padding:0 18px;border-radius:999px;background:var(--surface);color:var(--exp);font-weight:800;box-shadow:inset 0 0 0 1px var(--line)}
.dbtn.armed{background:var(--exp);color:#fff;box-shadow:none}
.namerow{display:flex;align-items:center;gap:12px}
.radios{display:flex;gap:22px}
.radios button{display:flex;align-items:center;gap:8px;font-weight:600}
.radios i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted)}
.radios [aria-checked="true"] i{box-shadow:inset 0 0 0 2px var(--green),inset 0 0 0 5px var(--bg),inset 0 0 0 9px var(--green)}
.planrow{display:flex;align-items:center;gap:10px}
.planrow .uline{width:130px}
.planrow span{color:var(--muted);font-weight:600}
.igrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;justify-items:center}
.igrid.cat{margin-bottom:6px}
.igrid.small{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.igrid button{width:52px;height:52px;max-width:100%;border-radius:50%;background:var(--surface2);color:var(--fg);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.igrid.small button{width:38px;height:38px}
.igrid button[aria-pressed="true"]{color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.igrid.small button[aria-pressed="true"]{background:var(--green);color:var(--surface)}
.igrid .moreic{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:30px;height:30px;border-radius:50%}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.sw.plus{display:grid;place-items:center;background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.addline{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:13px;font-weight:700;color:var(--green)}

/* charts */
.subtabs{display:flex;gap:16px;padding:0 4px}
.subtabs button{font-weight:600;font-size:14px;color:var(--muted);padding:4px 0;border-bottom:2px solid transparent}
.subtabs button[aria-pressed="true"]{color:var(--green);border-color:var(--green)}
.chart{padding:12px 6px 10px}
.sx{overflow-x:auto}
.sx svg{display:block;max-width:none}
.sx text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--muted);padding-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.srow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;padding:10px 14px;font-size:13px;align-items:center}
.srow+.srow{border-top:1px solid var(--line)}
.srow .inc{color:var(--inc)}
.srow b.neg{color:var(--exp)}
@media (max-width:380px){.srow{grid-template-columns:1fr auto;}.srow span:nth-child(2),.srow span:nth-child(3){display:none}}

/* drawer & sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,82%);background:var(--head);color:var(--head-ink);z-index:31;transform:translateX(-100%);transition:transform .22s ease;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#drawer.on{transform:none}
.dh{display:flex;gap:12px;align-items:center;padding:8px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dh b{display:block;font-size:17px}
.dh span.num{font-size:13px;color:var(--head-muted)}
.coin{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:600;flex:none}
#drawer-in>button{width:100%;display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:12px;font-weight:600;color:var(--head-ink);text-align:left}
#drawer-in>button .mi{color:var(--head-muted)}
#drawer-in>button[aria-current="page"]{background:var(--tag);color:var(--tag-ink)}
#drawer-in>button[aria-current="page"] .mi{color:var(--tag-ink)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .22s ease;max-height:88%;overflow-y:auto;overscroll-behavior:contain}
#sscrim{z-index:40}
#sheet.on{transform:none}
#sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheet-in h2{margin:0;font-size:18px}
.slist{display:flex;flex-direction:column}
.slist button{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 6px;text-align:left;font-weight:600;border-radius:12px}
.slist button .mi{color:var(--muted)}
.slist button[aria-pressed="true"]{background:var(--surface2)}
.slist button[aria-pressed="true"] .mi{color:var(--green)}
.linkbtn{align-self:flex-start;color:var(--green);font-weight:700;padding:4px 6px}
.count{align-self:flex-end;font-size:12px;color:var(--muted)}
.dlg{display:flex;justify-content:flex-end;gap:18px}
.dlg button{font-weight:800;color:var(--green);letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:8px 4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}
/* additions */
.toprow.wide{grid-template-columns:88px 1fr 88px}
.ibs{display:flex}
.ib{position:relative}
.badge{position:absolute;top:6px;right:5px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--exp);color:#fff;font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center;line-height:1}
.badge.in{position:static;margin-left:auto}
#drawer-in>button span:not(.mi){flex:1;text-align:left}

const data=()=>isSample()?sampleTxs():S.txs;
const accOf=id=>S.accounts.find(a=>a.id===id);
const accN=id=>accOf(id)?accOf(id).name:"?";
const trCat=(dir,other)=>({id:"__tr_"+dir+"_"+other,name:(dir==="out"?"Перевод → ":"Перевод ← ")+accN(other),icon:"sync_alt",color:"#5c6bc0"});
const catOf=(k,id)=>{if(id&&id.startsWith("__tr_")){const p=id.split("_");return trCat(p[3],p.slice(4).join("_"))}
  return S.cats[k].find(c=>c.id===id)||S.cats[k==="income"?"expense":"income"].find(c=>c.id===id)||{id,name:"Без категории",icon:"help",color:"#8d8d8d"}};
/* what the current account view sees: transfers turn into an expense on the source and an income on the target */
function proj(list,acc=S.acc){const out=[];list.forEach(t=>{
  if(t.kind!=="transfer"){if(!acc||t.acc===acc)out.push({t,kind:t.kind,c:catOf(t.kind,t.cat)})}
  else if(acc){if(t.from===acc)out.push({t,kind:"expense",c:trCat("out",t.to)});else if(t.to===acc)out.push({t,kind:"income",c:trCat("in",t.from)})}});return out}
function balances(real){const b={},all=real?S.txs:data();S.accounts.forEach(a=>b[a.id]=a.start||0);let tot=S.accounts.reduce((s,a)=>s+(a.start||0),0);
  all.forEach(t=>{if(t.kind==="transfer"){if(t.from in b)b[t.from]-=t.amount;if(t.to in b)b[t.to]+=t.amount;if(!(t.from in b)&&t.to in b)tot+=t.amount;if(t.from in b&&!(t.to in b))tot-=t.amount;return}
    const v=t.kind==="income"?t.amount:-t.amount;tot+=v;if(t.acc in b)b[t.acc]+=v});return{b,tot}}
function allTags(){const s=[...S.tags];[...S.txs].sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(t=>{if(t.tag&&!s.includes(t.tag))s.push(t.tag)});return s}
function gapDays(n){const have=new Set(S.txs.map(t=>t.date));const out=[];for(let i=n;i>=1;i--){const d=iso(addD(today0(),-i));if(!have.has(d))out.push(d)}return out}

/* ================= periods ================= */
function range(){const t=today0(),o=S.offset;
  if(S.period==="day"){const a=addD(t,o);return{from:iso(a),to:iso(addD(a,1)),label:(o===0?"Сегодня, ":o===-1?"Вчера, ":"")+a.getDate()+" "+MG[a.getMonth()]+(a.getFullYear()!==t.getFullYear()?" "+a.getFullYear():"")+" ("+WD[a.getDay()]+")",file:iso(a)}}
  if(S.period==="week"){const a=addD(t,-((t.getDay()+6)%7)+o*7),e=addD(a,6);return{from:iso(a),to:iso(addD(a,7)),label:a.getDate()+" "+MS[a.getMonth()]+" – "+e.getDate()+" "+MS[e.getMonth()],file:iso(a)+"_"+iso(e)}}
  if(S.period==="month"){const a=new Date(t.getFullYear(),t.getMonth()+o,1);return{from:iso(a),to:iso(new Date(a.getFullYear(),a.getMonth()+1,1)),label:cap(MONTHS[a.getMonth()])+" "+a.getFullYear(),file:MONTHS[a.getMonth()]+"_"+a.getFullYear()}}
  if(S.period==="year"){const y=t.getFullYear()+o;return{from:y+"-01-01",to:(y+1)+"-01-01",label:String(y),file:String(y)}}
  const c=S.custom||(S.custom={from:iso(new Date(t.getFullYear(),t.getMonth(),1)),to:iso(t)});
  const f=c.from<=c.to?c.from:c.to,e=c.from<=c.to?c.to:c.from;return{from:f,to:iso(addD(pd(e),1)),label:dShort(f)+" – "+dShort(e),file:f+"_"+e};
}
const inR=(t,r)=>t.date>=r.from&&t.date<r.to;
function periodBar(){const r=range();
  return `<div class="pbar"><div class="ptabs" role="tablist">${[["day","День"],["week","Неделя"],["month","Месяц"],["year","Год"],["custom","Период"]].map(([k,l])=>`<button data-act="period" data-p="${k}" aria-pressed="${S.period===k}">${l}</button>`).join("")}</div>
  ${S.period==="custom"?`<div class="pcustom"><input type="date" id="pc-from" value="${S.custom.from}" aria-label="С"><span>–</span><input type="date" id="pc-to" value="${S.custom.to}" aria-label="По"></div>`
  :`<div class="pnav"><button class="ib2" data-act="shift" data-d="-1" aria-label="Назад">${mi("chevron_left")}</button><span class="plabel">${r.label}</span><button class="ib2 ${S.offset>=0?"ghosted":""}" data-act="shift" data-d="1" aria-label="Вперёд">${mi("chevron_right")}</button></div>`}</div>`}
const tabsHtml=(act,cur,list,cls="")=>`<div class="ktabs ${cls}" role="tablist">${list.map(([k,l])=>`<button data-act="${act}" data-k="${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</div>`;
const kindTabs=(act="kind",cur=S.kind)=>tabsHtml(act,cur,[["expense","Расходы"],["income","Доходы"]]);
const accName=()=>S.acc&&accOf(S.acc)?accOf(S.acc).name:"Итого";
const bar=(left,center,right,extra="",wide)=>`<header class="bar"><div class="in"><div class="toprow${wide?" wide":""}">${left}<div class="ttl">${center}</div>${right||'<span class="ib ph"></span>'}</div>${extra}</div></header>`;
const backBtn=`<button class="ib" data-act="back" aria-label="Назад">${mi("arrow_back")}</button>`;
const unread=()=>S.events.filter(e=>!e.read).length;

/* ---- operation row ---- */
function opRow(e,neutral){const t=e.t;const isTr=t.kind==="transfer";const c=isTr&&neutral?TRC:e.c;
  const title=isTr&&!c.id.startsWith("__tr_")?accN(t.from)+" → "+accN(t.to):c.name;
  const a=accOf(t.acc);const showAcc=!isTr&&!S.acc&&a;
  const pill=t.tag||t.pay?`<span class="tagp">${esc(t.tag||"")}${t.tag&&t.pay?" · ":""}${t.pay?PAY[t.pay]||"":""}</span>`:"";
  const sign=neutral?"":e.kind==="income"?"+":"−";
  return `<button class="op" data-act="edit" data-id="${t.id}">${ci(c,"sm")}<span class="opm"><b>${esc(title)}</b>${showAcc?`<span class="sub">${esc(a.name)}</span>`:""}${pill}${t.note?`<span class="sub note">${esc(t.note)}</span>`:""}</span><span class="opv num ${neutral?"neutral":e.kind}">${sign}${money(t.amount)}</span></button>`}
function dayGroups(list){const days=[];list.forEach(e=>{const l=days[days.length-1];if(l&&l.d===e.t.date)l.items.push(e);else days.push({d:e.t.date,items:[e]})});
  return days.map(g=>{const d=pd(g.d);return `<h3 class="dhead">${d.getDate()} ${MG[d.getMonth()]} ${d.getFullYear()} г. (${WD[d.getDay()]})</h3><div class="card list">${g.items.map(e=>opRow(e,e.neutral)).join("")}</div>`}).join("")}
const sortE=(a,b)=>a.t.date<b.t.date?1:a.t.date>b.t.date?-1:(b.t.ts||0)-(a.t.ts||0);

/* ================= views ================= */
const V={};
V.home=()=>{
  if(S.acc&&!accOf(S.acc))S.acc=null;
  const {b,tot}=balances(),bal=S.acc?b[S.acc]:tot,r=range();
  const list=proj(data()).filter(e=>e.kind===S.kind&&inR(e.t,r));const total=sum(list,e=>e.t.amount);
  const by={};list.forEach(e=>{(by[e.c.id]=by[e.c.id]||{c:e.c,items:[]}).items.push(e)});
  const rows=Object.values(by).map(x=>({c:x.c,items:x.items,v:sum(x.items,e=>e.t.amount)})).sort((a,b)=>b.v-a.v);
  const R=78,C=2*Math.PI*R;let acc=0,segs="";
  if(total>0)rows.forEach(x=>{const len=x.v/total*C,gap=rows.length>1?2:0,dl=Math.max(len-gap,.8);segs+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${x.c.color}" stroke-width="24" stroke-dasharray="${dl} ${C-dl}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`;acc+=len});
  const banners=[];
  if(isSample())banners.push(`<div class="banner"><div><b>Это пример</b>Нажмите «+» и добавьте свою первую операцию, пример исчезнет.</div><button data-act="hide-sample">Скрыть</button></div>`);
  else if(PWA){if(S.mode==="local"&&!S.user&&S.loaded&&S.skipLogin)banners.push(`<div class="banner info"><div><b>Записи только на этом телефоне</b>Войдите, чтобы они хранились в облаке и не потерялись.</div><button data-act="login-open">Войти</button></div>`);if(S.mode!=="cloud"&&S.txs.length>=5&&(!S.backupAt||(Date.now()-new Date(S.backupAt).getTime())>7*864e5))banners.push(`<div class="banner"><div><b>${S.backupAt?"Резервной копии больше недели":"Резервной копии ещё нет"}</b>Данные хранятся только на этом телефоне. Сохраните копию на случай смены телефона.</div><button data-act="backup">Сохранить</button></div>`)}
  else if(S.mode==="local"&&S.loaded)banners.push(`<div class="banner"><div><b>Записи хранятся только в этом браузере</b>Войдите в Claude, чтобы они не потерялись.</div></div>`);
  const reminds=S.events.filter(e=>e.kind==="remind"&&!e.done).length,auto=S.events.filter(e=>e.kind==="auto"&&!e.read).length;
  if(reminds||auto)banners.push(`<div class="banner info"><div><b>${reminds?`Пора оплатить: ${reminds}`:""}${reminds&&auto?" · ":""}${auto?`Списано автоматически: ${auto}`:""}</b>Регулярные платежи</div><button data-act="nav" data-v="events">Открыть</button></div>`);
  if(!S.balSet&&S.accounts.every(a=>!a.start&&!a.checkedAt))banners.unshift(`<div class="banner info"><div><b>Сколько у вас сейчас на счетах?</b>Укажите реальные остатки на карте и наличными, чтобы баланс совпадал.</div><button data-act="bal-setup">Указать</button></div>`);
  {const hot=budgets().filter(b=>b.st!=="ok").sort((x,y)=>y.p-x.p);
   if(hot.length){const top=hot[0];banners.unshift(`<div class="banner ${top.st}"><div><b>${top.st==="over"?"Превышен план":"Бюджет почти исчерпан"}: ${esc(top.c.name)} ${Math.round(top.p)}%</b>${money(top.v)} из ${money(top.c.plan)}${hot.length>1?` · ещё категорий: ${hot.length-1}`:""}</div><button data-act="nav" data-v="budget">Бюджет</button></div>`)}}
  const gaps=S.txs.length?gapDays(7):[];
  if(gaps.length>=2&&S.hint!==todayIso())banners.push(`<div class="banner"><div><b>Нет записей за ${gaps.length} дн. из последних 7</b>Сверьте счета, и станет видно, где не сходится.</div><div class="bbtns"><button data-act="nav" data-v="check">Сверить</button><button data-act="hide-hint">Скрыть</button></div></div>`);
  const showPlan=S.period==="month"&&S.kind==="expense";
  const rowsHtml=rows.length?rows.map(x=>{const open=!!S.open[x.c.id];
    const tg={};let none=0;x.items.forEach(e=>{if(e.t.tag)tg[e.t.tag]=(tg[e.t.tag]||0)+e.t.amount;else none+=e.t.amount});
    const plan=showPlan&&x.c.plan>0?`<span class="plan"><span class="pb"><i style="width:${Math.min(100,x.v/x.c.plan*100).toFixed(1)}%;background:${x.v>x.c.plan?"var(--exp)":x.c.color}"></i></span>${Math.round(x.v/x.c.plan*100)}% от плана</span>`:"";
    return `<div class="crow${open?" open":""}"><button class="cmain" data-act="tcat" data-id="${x.c.id}" aria-expanded="${open}">${ci(x.c,"sm")}<span class="cn"><b>${esc(x.c.name)}</b>${plan}</span><span class="pct num">${Math.round(x.v/total*100)}%</span><span class="amt num">${money(x.v)}</span>${mi("expand_more","chev")}</button>
    ${open?`<div class="tagrows">${Object.keys(tg).sort((a,b)=>tg[b]-tg[a]).map(n=>`<button class="trow" data-act="ops" data-cat="${x.c.id}" data-tag="${esc(n)}">${mi("tag","xs")}<span>${esc(n)}</span><span class="num">${money(tg[n])}</span></button>`).join("")}
      ${none?`<button class="trow" data-act="ops" data-cat="${x.c.id}" data-tag="__none">${mi("remove","xs")}<span>Без тегов</span><span class="num">${money(none)}</span></button>`:""}
      <button class="trow all" data-act="ops" data-cat="${x.c.id}">${mi("receipt_long","xs")}<span>Все операции</span>${mi("chevron_right","xs")}</button></div>`:""}</div>`}).join("")
    :`<p class="empty">${S.kind==="expense"?"Расходов":"Доходов"} за этот период нет</p>`;
  const n=unread();
  return bar(`<div class="ibs"><button class="ib" data-act="drawer" aria-label="Меню">${mi("menu")}</button><span class="ib ph"></span></div>`,`<button class="accsel" data-act="pick-acc">${mi("account_balance_wallet","xs")}<span>${esc(accName())}</span>${mi("arrow_drop_down","xs")}</button><b class="bal num">${signed(bal)}</b>`,
    `<div class="ibs"><button class="ib" data-act="nav" data-v="events" aria-label="Уведомления">${mi("notifications")}${n?`<i class="badge">${n}</i>`:""}</button><button class="ib" data-act="ops-all" aria-label="Все операции">${mi("receipt_long")}</button></div>`,kindTabs(),true)
  +`<div class="page">${banners.join("")}<section class="card">${periodBar()}
    <div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Диаграмма по категориям"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--ring)" stroke-width="24"/>${segs}</svg><span class="dtot num">${short(total)}</span>
    <button class="fab" data-act="add" aria-label="Добавить операцию">${mi("add")}</button></div>
    <div class="crows">${rowsHtml}</div></section></div>`;
};

function opsEntries(){const r=range(),o=S.ops;let list;
  if(o.all){list=data().filter(t=>inR(t,r)&&t.tag===o.tag&&(!S.acc||t.acc===S.acc||t.from===S.acc||t.to===S.acc)).map(t=>({t,kind:t.kind==="transfer"?"expense":t.kind,c:t.kind==="transfer"?TRC:catOf(t.kind,t.cat)}))}
  else{const k=S.opsKind||"all";list=proj(data()).filter(e=>inR(e.t,r)&&(o.cat?e.c.id===o.cat:k==="all"||e.kind===k));
    if(!S.acc&&!o.cat)list=list.concat(data().filter(t=>t.kind==="transfer"&&inR(t,r)).map(t=>({t,kind:"transfer",c:TRC,neutral:true})));
    if(o.tag)list=list.filter(e=>o.tag==="__none"?!e.t.tag:e.t.tag===o.tag)}
  const q=S.opsQ.trim().toLowerCase();
  if(q)list=list.filter(e=>(e.c.name+" "+e.t.tag+" "+e.t.note+" "+e.t.amount+" "+(PAY[e.t.pay]||"")).toLowerCase().includes(q));
  return list.sort(sortE)}
V.ops=()=>{const o=S.ops;const cat=o.cat?catOf(S.kind,o.cat):null;const list=opsEntries();
  const allK=!cat&&!o.all&&(S.opsKind||"all")==="all";const real=list.filter(e=>!e.neutral);const total=allK?sum(real,e=>e.kind==="income"?e.t.amount:-e.t.amount):sum(real,e=>e.t.amount);
  const title=o.all?o.tag.toUpperCase():cat?cat.name.toUpperCase():"ОПЕРАЦИИ";
  const chips=`<div class="filters"><button class="accchip" data-act="pick-acc">${mi("account_balance_wallet","xs")}${esc(accName())}${mi("arrow_drop_down","xs")}</button>${o.tag&&!o.all?`<button class="fchip" data-act="clear-tag">${mi("close","xs")}${o.tag==="__none"?"Без тегов":esc(o.tag)}</button>`:""}</div>`;
  return bar(backBtn,`<small>${esc(title)}</small><b class="num">${allK?signed(total):money(total)}</b>`,`<div class="ibs"><button class="ib" data-act="ops-search" aria-label="Поиск">${mi("search")}</button><button class="ib" data-act="export" data-scope="period" aria-label="Выгрузить в Excel">${mi("download")}</button></div>`,cat||o.all?"":tabsHtml("okind",S.opsKind||"all",[["all","Все"],["expense","Расходы"],["income","Доходы"]],"three"),true)
  +`<div class="page">${chips}${S.opsSearch?`<input class="inp" id="ops-q" placeholder="Поиск по комментарию, тегу, сумме" value="${esc(S.opsQ)}" autocomplete="off">`:""}
   <section class="card">${periodBar()}</section>${!S.acc&&!cat&&!o.all&&list.some(e=>e.neutral)?`<p class="note">Переводы между счетами показаны серым и не входят в сумму «Итого».</p>`:""}
   ${list.length?dayGroups(list):`<p class="empty">Операций за этот период нет</p>`}</div>`};

/* ---- add / edit ---- */
let F=null;
const ck=()=>F.kind==="transfer"?"expense":F.kind;
function newForm(tx,preset){
  if(tx&&tx.pair){const o=S.txs.find(x=>x.pair===tx.pair&&x.kind==="expense"),n=S.txs.find(x=>x.pair===tx.pair&&x.kind==="income");
    if(o&&n){F={id:tx.pair,pair:tx.pair,kind:"transfer",amount:String(o.amount).replace(".",","),acc:o.acc,to:n.acc,cat:o.cat,date:o.date,tag:o.tag||"",pay:o.pay||"",note:o.note||"",ts:o.ts};F.err="";F.calc=false;F.tagq="";F.tagSearch=false;F.armed=false;return}}
  if(tx)F={id:tx.id,kind:tx.kind,amount:String(tx.amount).replace(".",","),acc:tx.kind==="transfer"?tx.from:tx.acc||"",to:tx.to||"",cat:tx.cat||"",date:tx.date,tag:tx.tag||"",pay:tx.pay||"",note:tx.note||"",ts:tx.ts};
  else{F={id:null,kind:S.kind,amount:"",acc:S.acc||"",to:"",cat:null,date:todayIso(),tag:S.ops.tag&&S.ops.tag!=="__none"&&S.view==="ops"?S.ops.tag:"",pay:"",note:"",ts:null};
    if(S.view==="ops"&&S.ops.cat&&!S.ops.cat.startsWith("__tr_"))F.cat=S.ops.cat;
    if(preset)Object.assign(F,preset)}
  if(!F.cat||!S.cats[ck()].some(c=>c.id===F.cat))F.cat=topCats(ck())[0].id;
  F.err="";F.calc=false;F.tagq="";F.tagSearch=false;F.armed=false}
function topCats(k){const cnt={};S.txs.forEach(t=>{if(t.kind===k)cnt[t.cat]=(cnt[t.cat]||0)+1});
  return S.cats[k].map((c,i)=>({c,i})).sort((a,b)=>(cnt[b.c.id]||0)-(cnt[a.c.id]||0)||a.i-b.i).map(x=>x.c)}
function tagChips(){const q=F.tagq.trim().toLowerCase();const list=allTags().filter(n=>!q||n.toLowerCase().includes(q));
  if(F.tag&&!list.includes(F.tag))list.unshift(F.tag);
  return list.map(n=>`<button class="tchip" data-act="ftag" data-n="${esc(n)}" aria-pressed="${F.tag===n}">${esc(n)}</button>`).join("")+`<button class="tchip add" data-act="add-tag">${mi("add","xs")}Добавить тег</button>`}
const payChips=()=>F.tag?`<div class="fld" id="payfld"><span class="lbl">Выплата сотруднику</span><div class="tchips">${Object.entries(PAY).map(([k,l])=>`<button class="tchip" data-act="fpay" data-k="${k}" aria-pressed="${F.pay===k}">${l}</button>`).join("")}</div></div>`:"";
V.add=()=>{const tr=F.kind==="transfer";
  let top=topCats(ck()).slice(0,7);if(!top.some(c=>c.id===F.cat)){const c=S.cats[ck()].find(c=>c.id===F.cat);if(c)top[6]=c}
  const t=today0(),days=[0,1,2].map(k=>addD(t,-k)),lbl=["сегодня","вчера","позавчера"];const other=!days.some(d=>iso(d)===F.date);
  const fd=d=>pad(d.getDate())+"."+pad(d.getMonth()+1);const a=accOf(F.acc),to=accOf(F.to);
  return bar(backBtn,`<b class="t1">${F.id?"Изменение операции":"Добавление операции"}</b>`,"",tabsHtml("fkind",F.kind,[["expense","Расходы"],["income","Доходы"],["transfer","Перевод"]],"three"))
  +`<div class="page form">
    <div class="amt-row"><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(F.amount)}" aria-label="Сумма"><span class="code">${code()}</span><button class="ib2" data-act="calc" aria-pressed="${F.calc}" aria-label="Калькулятор">${mi("calculate")}</button></div>
    ${F.calc?`<div class="calc">${["+","−","×","÷","⌫","="].map(k=>`<button data-act="calck" data-k="${k}">${k}</button>`).join("")}</div>`:""}
    ${F.err?`<p class="err">${F.err}</p>`:""}
    ${tr?`<div class="trrow"><div class="fld"><span class="lbl">Откуда</span><button class="linkv" data-act="pick-facc">${a?esc(a.name):"Выбрать"}</button></div>${mi("arrow_forward","trarrow")}<div class="fld"><span class="lbl">Куда</span><button class="linkv" data-act="pick-fto">${to?esc(to.name):"Выбрать"}</button></div></div>
      <p class="note">Запишется две операции: расход в «${a?esc(a.name):"откуда"}» и доход в «${to?esc(to.name):"куда"}», с одной категорией, тегом и комментарием.</p>`
    :`<div class="fld"><span class="lbl">Счёт</span><button class="linkv" data-act="pick-facc">${a?esc(a.name):"Не задан"}</button></div>`}
    ${`<div class="fld"><span class="lbl">Категории</span><div class="cgrid">${top.map(c=>`<button class="cpick" data-act="fcat" data-id="${c.id}" aria-pressed="${F.cat===c.id}">${ci(c)}<span>${esc(c.name)}</span></button>`).join("")}<button class="cpick" data-act="go" data-v="catpick"><span class="ci more">${mi("add")}</span><span>Ещё</span></button></div></div>`}

V.check=()=>{const {b}=balances();const gaps=S.txs.length?gapDays(14):[];

    return `<section class="card chk"><div class="chkh"><span class="ci sm acc">${mi(a.icon)}</span><div><b>${esc(a.name)}</b><span class="sub">${a.checkedAt?"Последняя сверка "+dShort(a.checkedAt):"Ещё не сверяли"}</span></div></div>

  ${gaps.length?`<p class="note">Скорее всего, разница появилась в эти дни. Нажмите на день, чтобы добавить забытую операцию.</p><div class="tchips">${gaps.map(d=>`<button class="tchip" data-act="gap-add" data-d="${d}">${dShort(d)}, ${WD[pd(d).getDay()]}</button>`).join("")}</div>`:`<p class="note">Пропусков нет, записи есть за каждый день.</p>`}</div>`};
function chkDiff(a,diff){if(diff==null)return "";
  if(diff===0)return `<p class="ok">${mi("check","xs")}Всё сходится</p><button class="ghostbtn" data-act="chk-mark" data-id="${a.id}">Отметить сверку</button>`;
  return `<p class="${diff<0?"bad":"good"}">${diff<0?"Не хватает":"Лишние"} ${money(Math.abs(diff))}</p>
  <p class="note">${diff<0?"Похоже, какие-то расходы не записаны. Можно добавить их по дням ниже или записать разницу одной операцией «Не учтено».":"Похоже, какой-то доход не записан. Можно добавить его или записать разницу как «Не учтено»."}</p>
  <div class="row2"><button class="ghostbtn" data-act="chk-fix" data-id="${a.id}">Записать разницу</button><button class="ghostbtn" data-act="chk-mark" data-id="${a.id}">Только отметить</button></div>`}

/* ---- payroll ledger ---- */
function ledgerData(){const r=range();const L={};
  data().filter(t=>t.tag&&inR(t,r)&&(t.kind==="expense"||t.kind==="transfer")&&(!S.acc||t.acc===S.acc||t.from===S.acc||t.to===S.acc)).forEach(t=>{
    const x=L[t.tag]=L[t.tag]||{name:t.tag,total:0,advance:0,salary:0,bonus:0,hold:0,other:0,n:0,last:""};
    x.total+=t.amount;x[t.pay&&x[t.pay]!=null?t.pay:"other"]+=t.amount;x.n++;if(t.date>x.last)x.last=t.date});
  return Object.values(L).sort((a,b)=>b.total-a.total)}
V.ledger=()=>{const L=ledgerData();const tot=sum(L,x=>x.total),hold=sum(L,x=>x.hold);
  return bar(backBtn,`<small>ВЕДОМОСТЬ</small><b class="num">${money(tot)}</b>`,`<button class="ib" data-act="export" data-scope="period" aria-label="Выгрузить в Excel">${mi("download")}</button>`)
  +`<div class="page"><div class="filters"><button class="accchip" data-act="pick-acc">${mi("account_balance_wallet","xs")}${esc(accName())}${mi("arrow_drop_down","xs")}</button></div>
  <section class="card">${periodBar()}</section>
  ${hold?`<div class="banner"><div><b>К удержанию: ${money(hold)}</b>Деньги, выданные с пометкой «Удержать потом». Не забудьте вычесть их при расчёте.</div></div>`:""}
  ${L.length?L.map(x=>`<button class="card led" data-act="ops-tag" data-tag="${esc(x.name)}"><div class="ledh"><span class="ci sm acc">${mi("person")}</span><b>${esc(x.name)}</b><b class="num">${money(x.total)}</b></div>
    <div class="ledg">${[["advance","Аванс"],["salary","Зарплата"],["bonus","Премия"],["hold","Удержать потом"],["other","Без пометки"]].filter(([k])=>x[k]).map(([k,l])=>`<span class="${k==="hold"?"hold":""}"><small>${l}</small><b class="num">${money(x[k])}</b></span>`).join("")}</div>
    <span class="sub">${x.n} ${x.n%10===1&&x.n%100!==11?"выплата":x.n%10>=2&&x.n%10<=4&&(x.n%100<10||x.n%100>=20)?"выплаты":"выплат"} · последняя ${dShort(x.last)}</span></button>`).join("")
  :`<p class="empty">За этот период выплат нет. Отметьте операцию тегом сотрудника, например «Зп Ерлан», и она появится здесь.</p>`}</div>`};

/* ---- debts ---- */
const paidOf=d=>sum(d.paid||[]);const restOf=d=>Math.round((d.amount-paidOf(d))*100)/100;
V.debts=()=>{const tab=S.debtTab;const list=S.debts.filter(d=>d.dir===tab).sort((a,b)=>a.date<b.date?1:-1);const open=list.filter(d=>restOf(d)>0),closed=list.filter(d=>restOf(d)<=0);

    <span class="sub">${rest<=0?"Закрыт":"Осталось"} · всего ${money(d.amount)} · с ${dShort(d.date)}${d.acc&&accOf(d.acc)?" · "+esc(accN(d.acc)):""}</span>${d.note?`<span class="sub note">${esc(d.note)}</span>`:""}

  return bar(backBtn,`<small>${tab==="gave"?"МНЕ ДОЛЖНЫ":"Я ДОЛЖЕН"}</small><b class="num">${money(sum(open,restOf))}</b>`,"",tabsHtml("dtab",tab,[["gave","Мне должны"],["took","Я должен"]]))

  <p class="note">Если указать счёт, выдача и возвраты долга сами запишутся операциями в этот счёт.</p></div>`};

/* ---- regular payments ---- */
const schedText=r=>r.freq==="week"?"каждую неделю, "+WDF[r.wd]:"каждый месяц, "+r.day+" числа";
function dim(y,m){return new Date(y,m+1,0).getDate()}
function firstDue(r){const s=pd(r.start||todayIso());if(r.freq==="week"){let d=new Date(s);while(d.getDay()!==Number(r.wd))d=addD(d,1);return iso(d)}
  let y=s.getFullYear(),m=s.getMonth();let d=new Date(y,m,Math.min(r.day,dim(y,m)));if(d<s){m++;d=new Date(y,m,Math.min(r.day,dim(y,m)))}return iso(d)}
function nextAfter(r,ds){const d=pd(ds);if(r.freq==="week")return iso(addD(d,7));const y=d.getFullYear(),m=d.getMonth()+1;return iso(new Date(y,m,Math.min(r.day,dim(y,m))))}
V.regs=()=>bar(backBtn,`<b class="t1">Регулярные платежи</b>`,"")
  +`<div class="page">${S.regs.length?`<div class="card list">${S.regs.map(r=>{const c=catOf(r.kind,r.cat);return `<button class="op" data-act="reg-edit" data-id="${r.id}">${ci(c,"sm")}<span class="opm"><b>${esc(r.name)}</b><span class="sub">${schedText(r)}</span><span class="tagp ${r.auto?"":"alt"}">${r.active?(r.auto?"Записывается сам":"Напоминание"):"На паузе"}</span>${r.active?`<span class="sub">Следующий: ${dShort(r.next)}${r.acc&&accOf(r.acc)?" · "+esc(accN(r.acc)):""}</span>`:""}</span><span class="opv num ${r.kind}">${r.kind==="income"?"+":""}${money(r.amount)}</span></button>`}).join("")}</div>`:`<p class="empty">Добавьте то, что платите каждый месяц или неделю: коммуналку, связь, зарплаты. Приложение само запишет платёж в нужный день или напомнит о нём.</p>`}

let R=null;

  +`<div class="page form">

  ${R.freq==="month"?`<div class="fld"><label class="lbl" for="r-day">Число месяца</label>${sel("r-day",Array.from({length:31},(_,i)=>[i+1,String(i+1)+(i+1>28?" (или последний день)":"")]),R.day)}</div>`

function pushEvent(e){if(S.events.some(x=>x.id===e.id))return false;S.events.unshift({read:false,done:false,...e});S.events=S.events.slice(0,60);return true}
async function runRegs(){const today=todayIso();let ch=false;const writes=[];
  S.regs.forEach(r=>{if(!r.active||!r.next)return;let g=0,rc=false;
    while(r.next<=today&&g++<36){const d=r.next;
      if(r.auto){const id="r_"+r.id+"_"+d;if(!S.txs.some(t=>t.id===id)){const tx={id,kind:r.kind,cat:r.cat,amount:r.amount,date:d,acc:r.acc,from:"",to:"",tag:r.tag||"",pay:"",note:r.name,ts:Date.now()};S.txs.push(tx);writes.push([id,{type:"tx",...tx}])}

function spentThisMonth(catId){const r=monthRange();return sum(data().filter(t=>t.kind==="expense"&&t.cat===catId&&inR(t,r)))}
function budgets(){return S.cats.expense.filter(c=>c.plan>0).map(c=>{const v=spentThisMonth(c.id),p=v/c.plan*100,w=c.warn||80;return{c,v,p,w,st:p>=100?"over":p>=w?"warn":"ok"}})}

      <div class="budbar"><i style="width:${Math.min(100,b.p).toFixed(1)}%;background:${b.st==="over"?"var(--exp)":b.st==="warn"?"var(--warn)":b.c.color}"></i><s style="left:${b.w}%"></s></div>
      <div class="budf"><span>${b.v>b.c.plan?`Сверх плана: <b class="num">${money(b.v-b.c.plan)}</b>`:`Осталось: <b class="num">${money(b.c.plan-b.v)}</b>`}</span><span>Предупредить на ${b.w}%</span></div></button>`).join("")

V.charts=()=>{const ch=S.chart,t=today0();let B=[];
  if(ch.by==="month")for(let i=5;i>=0;i--){const a=new Date(t.getFullYear(),t.getMonth()-i,1);B.push({from:iso(a),to:iso(new Date(a.getFullYear(),a.getMonth()+1,1)),l:MSH[a.getMonth()],l2:a.getMonth()===0||i===5?String(a.getFullYear()):"",name:MONTHS[a.getMonth()]})}
  else if(ch.by==="week"){const m=addD(t,-((t.getDay()+6)%7));for(let i=7;i>=0;i--){const a=addD(m,-7*i);B.push({from:iso(a),to:iso(addD(a,7)),l:a.getDate()+" "+MSH[a.getMonth()],l2:"",name:"неделя с "+dShort(iso(a))})}}
  else for(let i=4;i>=0;i--){const y=t.getFullYear()-i;B.push({from:y+"-01-01",to:(y+1)+"-01-01",l:String(y),l2:"",name:y+" год"})}
  const all=proj(data());B.forEach(x=>{x.inc=0;x.exp=0;x.cats={};all.forEach(e=>{if(e.t.date>=x.from&&e.t.date<x.to){if(e.kind==="income")x.inc+=e.t.amount;else{x.exp+=e.t.amount;x.cats[e.c.id]=(x.cats[e.c.id]||0)+e.t.amount}}});x.pr=x.inc-x.exp});
  const series=ch.tab==="all"?[["inc","Доходы","var(--c-inc)"],["exp","Расходы","var(--c-exp)"],["pr","Прибыль","var(--c-pr)"]]:ch.tab==="exp"?[["exp","Расходы","var(--c-exp)"]]:[["inc","Доходы","var(--c-inc)"]];
  let mx=0,mn=0;B.forEach(x=>series.forEach(([k])=>{mx=Math.max(mx,x[k]);mn=Math.min(mn,x[k])}));if(mx===0&&mn===0)mx=1;
  const step=niceStep((mx-mn)/4),top=Math.ceil(mx/step)*step,bot=Math.floor(mn/step)*step;
  const L=52,H=200,gw=Math.max(54,series.length*16+22),W=L+B.length*gw+8,y=v=>10+(top-v)/(top-bot)*(H-10);
  let g="";for(let v=bot;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${axis(v)}</text>`}
  B.forEach((x,i)=>{const x0=L+i*gw+(gw-series.length*14)/2;series.forEach(([k,,c],j)=>{const v=x[k],y1=y(Math.max(v,0)),y2=y(Math.min(v,0));g+=`<rect x="${x0+j*14}" y="${y1}" width="11" height="${Math.max(y2-y1,v?1.5:0)}" rx="2" fill="${c}"><title>${money(v)}</title></rect>`});
    g+=`<text x="${L+i*gw+gw/2}" y="${H+16}" text-anchor="middle">${x.l}</text>${x.l2?`<text x="${L+i*gw+gw/2}" y="${H+30}" text-anchor="middle">${x.l2}</text>`:""}`});
  const cur=B[B.length-1],prev=B[B.length-2];
  const delta=(a,b,good)=>{if(!b&&!a)return `<span class="dl">—</span>`;if(!b)return `<span class="dl">новое</span>`;const p=Math.round((a-b)/Math.abs(b)*100);if(p===0)return `<span class="dl">0%</span>`;const up=p>0;const ok=good==="up"?up:!up;return `<span class="dl ${ok?"good":"bad"}">${mi(up?"trending_up":"trending_down","xs")}${up?"+":""}${p}%</span>`};
  const catIds=[...new Set(Object.keys(cur.cats).concat(Object.keys(prev.cats)))].map(id=>({id,a:cur.cats[id]||0,b:prev.cats[id]||0})).sort((p,q)=>Math.abs(q.a-q.b)-Math.abs(p.a-p.b)).slice(0,6);
  const cmp=`<section class="card cmp"><h3>${cap(cur.name)} и ${prev.name}</h3>
    <div class="cmprow"><span>Доходы</span><b class="num">${money(cur.inc)}</b>${delta(cur.inc,prev.inc,"up")}</div>
    <div class="cmprow"><span>Расходы</span><b class="num">${money(cur.exp)}</b>${delta(cur.exp,prev.exp,"down")}</div>
    <div class="cmprow"><span>Прибыль</span><b class="num">${signed(cur.pr)}</b>${delta(cur.pr,prev.pr,"up")}</div>
    ${catIds.length?`<h4>Расходы по категориям</h4>${catIds.map(x=>{const c=catOf("expense",x.id);return `<div class="cmprow cat">${ci(c,"xs2")}<span>${esc(c.name)}</span><b class="num">${money(x.a)}</b>${delta(x.a,x.b,"down")}</div>`}).join("")}<p class="note">Проценты считаются к прошлому периоду: ${prev.name}.</p>`:""}</section>`;
  return bar(backBtn,`<b class="t1">Графики</b>`,"",tabsHtml("ctab",ch.tab,[["all","Общий"],["exp","Расходы"],["inc","Доходы"]],"three"))
  +`<div class="page"><div class="filters"><button class="accchip" data-act="pick-acc">${mi("account_balance_wallet","xs")}${esc(accName())}${mi("arrow_drop_down","xs")}</button></div><div class="subtabs">${[["year","по годам"],["month","по месяцам"],["week","по неделям"]].map(([k,l])=>`<button data-act="cby" data-k="${k}" aria-pressed="${ch.by===k}">${l}</button>`).join("")}</div>
   <section class="card chart"><div class="sx"><svg viewBox="0 0 ${W} ${H+36}" width="${W}" height="${H+36}" role="img" aria-label="График">${g}</svg></div>
   <div class="legend">${series.map(([,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div></section>
   ${cmp}
   <div class="card list">${B.slice().reverse().map(x=>`<div class="srow"><span>${x.l} ${x.l2}</span><span class="num inc">${x.inc?"+":""}${money(x.inc)}</span><span class="num">${x.exp?"−":""}${money(x.exp)}</span><b class="num ${x.pr<0?"neg":""}">${signed(x.pr)}</b></div>`).join("")}</div></div>`};
function niceStep(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

function evalAmt(s){s=String(s).replace(/\s/g,"").replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");if(!s)return NaN;
  const k=s.match(/\d+(?:\.\d+)?|\.\d+|[+\-*/]/g);if(!k||k.join("")!==s)return NaN;let i=0;
  const num=()=>{let g=1;while(k[i]==="-"||k[i]==="+"){if(k[i]==="-")g=-g;i++}const v=parseFloat(k[i++]);return g*v};
  const term=()=>{let v=num();while(k[i]==="*"||k[i]==="/"){const o=k[i++],r=num();v=o==="*"?v*r:v/r}return v};
  let v=term();while(k[i]==="+"||k[i]==="-"){const o=k[i++],r=term();v=o==="+"?v+r:v-r}
  return i===k.length&&isFinite(v)?Math.round(v*100)/100:NaN}

let col=null,fb=null,unsub=null,regsRan=false;
const runRegsOnce=()=>{if(!regsRan){regsRan=true;runRegs()}};
function fbErr(e){const c=(e&&e.code)||"";
  if(/invalid-email/.test(c))return "Проверьте адрес почты.";
  if(/missing-password/.test(c))return "Введите пароль.";
  if(/weak-password/.test(c))return "Пароль должен быть не короче 6 символов.";
  if(/email-already-in-use/.test(c))return "Эта почта уже зарегистрирована. Нажмите «Вход».";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return "Неверная почта или пароль.";
  if(/too-many-requests/.test(c))return "Слишком много попыток. Подождите пару минут.";
  if(/network-request-failed/.test(c))return "Нет интернета. Для входа нужна сеть.";
  if(/popup-closed|cancelled-popup/.test(c))return "";
  if(/popup-blocked|operation-not-supported|unauthorized-domain|web-storage-unsupported/.test(c))return "Вход через Google здесь не сработал. Войдите по почте и паролю.";
  if(/permission-denied/.test(c))return "Облако не пускает запись. Проверьте правила Firestore.";
  return "Что-то пошло не так. Попробуйте ещё раз.";}
/* writes never block: Firestore keeps them on the phone and sends them when internet appears */
function remoteSet(id,o){
  if(!col){if(PWA&&S.cloudUid){S.pend[id]=o;saveLocal()}return Promise.resolve()}
  const p=col.doc(id).set(o);
  if(fb){p.catch(e=>toast(fbErr(e)));return Promise.resolve()}
  return p.catch(()=>toast("Не удалось сохранить в аккаунт. Запись осталась на устройстве."))}
function remoteDel(id){
  if(!col){if(PWA&&S.cloudUid){S.pend[id]=null;saveLocal()}return Promise.resolve()}
  const p=col.doc(id).delete();
  if(fb){p.catch(e=>toast(fbErr(e)));return Promise.resolve()}
  return p.catch(()=>toast("Не удалось удалить из аккаунта. Попробуйте ещё раз."))}

function readSnap(snap){const o={txs:[],debts:[],regs:[],cats:null,cur:null,accs:null,tags:null,events:null,ids:new Set()};
  snap.docs.forEach(d=>{o.ids.add(d.id);const v=d.data();if(!v)return;
    if(v.type==="tx")o.txs.push(fixTx({...v,id:v.id||d.id}));else if(v.type==="cats")o.cats=v;else if(v.type==="prefs")o.cur=v.currency;
    else if(v.type==="accounts"&&Array.isArray(v.list)&&v.list.length)o.accs=v.list;else if(v.type==="tags"&&Array.isArray(v.list))o.tags=v.list;
    else if(v.type==="events"&&Array.isArray(v.list))o.events=v.list;else if(v.type==="debt"){const{type,...x}=v;o.debts.push(x)}else if(v.type==="reg"){const{type,...x}=v;o.regs.push(x)}});
  return o}
function applyCloud(o){S.loaded=true;S.txs=o.txs;S.debts=o.debts;S.regs=o.regs;S.cats=migrateCats(o.cats||S.cats,o.txs);if(o.cur)S.currency=o.cur;if(o.accs)S.accounts=o.accs.map(fixAcc);if(o.tags)S.tags=o.tags;if(o.events)S.events=o.events;
  if(S.txs.length)S.sampleHidden=true;saveLocal();
  const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||!$("#sheet").hidden;if(!typing&&S.view!=="login")render(true);
  runRegsOnce()}
/* send to the cloud whatever is on this phone and missing there */
function uploadMissing(ids){
  S.txs.forEach(t=>{if(!ids.has(t.id))remoteSet(t.id,{type:"tx",...t})});
  S.debts.forEach(d=>{if(!ids.has("debt_"+d.id))remoteSet("debt_"+d.id,{type:"debt",...d})});
  S.regs.forEach(r=>{if(!ids.has("reg_"+r.id))remoteSet("reg_"+r.id,{type:"reg",...r})});
  if(!ids.has("cats"))remoteSet("cats",{type:"cats",expense:S.cats.expense,income:S.cats.income});
  if(!ids.has("accounts"))remoteSet("accounts",{type:"accounts",list:S.accounts});
  if(!ids.has("tags"))remoteSet("tags",{type:"tags",list:S.tags});
  if(!ids.has("events"))saveEvents();
  if(!ids.has("prefs"))remoteSet("prefs",{type:"prefs",currency:S.currency})}
function mergeLocal(o){const m={...o};
  m.txs=o.txs.concat(S.txs.filter(t=>!o.ids.has(t.id)));
  m.debts=o.debts.concat(S.debts.filter(d=>!o.ids.has("debt_"+d.id)));
  m.regs=o.regs.concat(S.regs.filter(r=>!o.ids.has("reg_"+r.id)));
  m.cats=o.cats||{expense:S.cats.expense,income:S.cats.income};m.accs=o.accs||S.accounts;m.tags=o.tags||S.tags;m.events=o.events||S.events;m.cur=o.cur||S.currency;return m}

/* ---- Firebase (installed app) ---- */
function startCloud(uid){
  col=fb.db.collection("users").doc(uid).collection("items");S.mode="cloud";
  if(S.cloudUid===uid&&Object.keys(S.pend).length){for(const [id,o] of Object.entries(S.pend)){if(o)remoteSet(id,o);else remoteDel(id)}S.pend={}}
  S.cloudUid=uid;saveLocal();render(true);
  unsub=col.onSnapshot({includeMetadataChanges:false},snap=>{
    if(S.syncedUid!==uid){
      if(snap.metadata.fromCache)return; // wait for the real cloud before merging this phone in
      const o=readSnap(snap);uploadMissing(o.ids);S.syncedUid=uid;applyCloud(mergeLocal(o));
      if(o.ids.size===0&&S.txs.length)toast("Записи с телефона отправлены в облако");return}
    applyCloud(readSnap(snap))
  },e=>{toast(fbErr(e));col=null;S.mode="local";render(true)});
}
function initFirebase(){
  if(!window.firebase||!firebase.initializeApp){S.loaded=true;S.fbMissing=true;render(true);runRegsOnce();return}
  try{firebase.initializeApp(FB_CONFIG);const db=firebase.firestore();
    db.settings({ignoreUndefinedProperties:true,cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED,merge:true});
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    fb={auth:firebase.auth(),db}}
  catch(e){S.loaded=true;S.fbMissing=true;render(true);runRegsOnce();return}
  fb.auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}col=null;
    S.user=u?{uid:u.uid,email:u.email||"",name:u.displayName||""}:null;
    if(u){if(S.view==="login")root("home");startCloud(u.uid)}
    else{S.mode="local";S.loaded=true;if(!S.skipLogin&&S.view!=="login")root("login");else render(true);runRegsOnce()}
  });
}

  <button class="linkbtn c muted" data-act="login-skip">Без аккаунта, только на этом телефоне</button>
  ${S.fbMissing?`<p class="note c">Сейчас нет связи с облаком. Подключитесь к интернету, чтобы войти.</p>`:""}</div>`;
function moonSvg(sz){return `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" aria-hidden="true"><path d="M14.6 2.6A9.4 9.4 0 1 0 21.4 16a7.6 7.6 0 0 1-6.8-13.4z" fill="#f2b636"/><path d="M18 5.2l.7 1.5 1.6.2-1.2 1.1.3 1.6-1.4-.8-1.4.8.3-1.6-1.2-1.1 1.6-.2z" fill="#52be7a"/></svg>`}
function lRead(){const e=$("#l-email");if(e)L.email=e.value.trim();const p=$("#l-pass");return p?p.value:""}
function lFail(e){L.busy=false;L.err=fbErr(e);render(true)}
function needFb(){if(fb)return true;L.err="Нет связи с облаком. Подключитесь к интернету и откройте приложение заново.";render(true);return false}
Object.assign(ACT,{
  lmode:el=>{lRead();L.mode=el.dataset.k;L.err="";render(true)},
  "login-go":async()=>{const pass=lRead();if(!needFb())return;
    if(!L.email){L.err="Введите почту.";render(true);return}if(!pass){L.err="Введите пароль.";render(true);return}
    L.busy=true;L.err="";render(true);
    try{if(L.mode==="in")await fb.auth.signInWithEmailAndPassword(L.email,pass);else await fb.auth.createUserWithEmailAndPassword(L.email,pass);L.busy=false}catch(e){lFail(e)}},
  "login-google":async()=>{lRead();if(!needFb())return;
    try{await fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){const m=fbErr(e);if(m){L.err=m;render(true)}}},
  "login-reset":async()=>{lRead();if(!needFb())return;if(!L.email){L.err="Впишите почту, и мы пришлём ссылку для нового пароля.";render(true);return}
    try{await fb.auth.sendPasswordResetEmail(L.email);L.err="";render(true);toast("Письмо для смены пароля отправлено на "+L.email)}catch(e){lFail(e)}},
  "login-skip":()=>{S.skipLogin=true;saveLocal();root("home")},
  "login-open":()=>{S.skipLogin=false;saveLocal();L.err="";root("login")},
  logout:()=>openSheet(`<h2>Выйти из аккаунта?</h2><p class="note">Записи останутся в облаке. С этого телефона они будут убраны и вернутся, когда вы снова войдёте.</p><div class="dlg"><button data-act="sheet-close">Отмена</button><button data-act="logout-ok">Выйти</button></div>`),
  "logout-ok":async()=>{closeSheet();if(Object.keys(S.pend).length||!navigator.onLine){toast("Сначала подключитесь к интернету, чтобы всё успело уйти в облако.");return}
    try{await fb.auth.signOut()}catch(e){toast(fbErr(e));return}
    Object.assign(S,{txs:[],cats:JSON.parse(JSON.stringify(DEFAULT_CATS)),accounts:JSON.parse(JSON.stringify(DEFAULT_ACCS)),tags:[],debts:[],regs:[],events:[],currency:"₸",sampleHidden:false,balSet:false,backupAt:"",syncedUid:"",cloudUid:"",pend:{},skipLogin:false,acc:null});
    try{localStorage.removeItem(LS)}catch(e){}fb.db.terminate().then(()=>fb.db.clearPersistence()).catch(()=>{}).finally(()=>location.reload())}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="l-pass"||e.target.id==="l-email"))ACT["login-go"]()});

/* ---- start ---- */
loadLocal();
if(PWA){if(!S.skipLogin&&!S.cloudUid&&!S.txs.length)S.view="login";render();
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initFirebase);else initFirebase();
  setTimeout(()=>loadXlsx().catch(()=>{}),3000)}
else{render();
(async()=>{try{
  if(!window.claude||!window.claude.use){S.loaded=true;render(true);runRegsOnce();return}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);const id=user?await user.id():null;
  if(!db||!id){S.loaded=true;render(true);runRegsOnce();return}
  col=db.collection("data/users/"+id);S.mode="db";let first=true;
  const timer=setTimeout(()=>{if(first){S.loaded=true;toast("Аккаунт отвечает долго. Показываю данные с устройства.");render(true)}},10000);
  col.onSnapshot(snap=>{clearTimeout(timer);const o=readSnap(snap);
    if(first&&o.ids.size===0&&(S.txs.length||S.debts.length||S.regs.length)){first=false;S.loaded=true;uploadMissing(o.ids);render(true);runRegsOnce();return}
    first=false;applyCloud(o)
  },()=>{clearTimeout(timer);col=null;S.mode="local";S.loaded=true;render(true);toast("Нет связи с аккаунтом. Записи сохраняются на устройстве.")});
}catch(e){S.mode="local";S.loaded=true;render(true);runRegsOnce()}})()}
})();

</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
</body>
</html>
